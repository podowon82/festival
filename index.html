const $=s=>document.querySelector(s);
const enc=encodeURIComponent;
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const nmap=q=>'https://map.naver.com/p/search/'+enc(q);
const kmapTo=(n,la,ln)=> (la&&ln)?('https://map.kakao.com/link/to/'+enc(n)+','+la+','+ln):('https://map.kakao.com/link/search/'+enc(n));
const regions=[...new Set(FESTS.map(f=>f.short))].filter(Boolean);
let cur='';
function chipBar(){const c=$('#chips');c.innerHTML='<button data-r="" class="'+(cur===''?'on':'')+'">전체</button>'+regions.map(r=>'<button data-r="'+esc(r)+'" class="'+(cur===r?'on':'')+'">'+esc(r)+'</button>').join('');c.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.r;$('#q').value='';render();});}
function card(f){
  const park=(f.parking||[]).map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+esc(p.note||'')+'</td><td><a href="'+nmap(p.address||p.name)+'" target="_blank" rel="noopener">지도 보기</a></td></tr>').join('');
  return '<article class="card"><h2>'+esc(f.name)+'</h2>'+
  '<div class="meta"><span>📍 '+esc(f.region)+'</span><span>🗓 '+esc(f.dates)+' <span class="badge'+(/^확정/.test(f.dateStatus)?'':' plan')+'">'+esc(/^확정/.test(f.dateStatus)?'일정 확정':'예정')+'</span></span>'+(f.fee?'<span>🎫 '+esc(f.fee)+'</span>':'')+(f.hours?'<span>⏰ '+esc(f.hours)+'</span>':'')+'</div>'+
  '<p>'+esc(f.feature)+'</p>'+
  '<div class="sec">주요 볼거리</div><ul class="hl">'+(f.highlights||[]).map(h=>'<li>'+esc(h)+'</li>').join('')+'</ul>'+
  '<div class="sec">찾아가는 방법</div><p>행사장: <b>'+esc(f.venue)+'</b>'+(f.address?' ('+esc(f.address)+')':'')+'</p>'+(f.transit?'<p>🚇 '+esc(f.transit)+'</p>':'')+
  (park?'<div class="sec">추천 주차장</div><table><thead><tr><th>주차장</th><th>참고</th><th>위치</th></tr></thead><tbody>'+park+'</tbody></table>':'')+
  '<div class="btns"><a class="b-naver" href="'+nmap(f.venue+' '+(f.region||''))+'" target="_blank" rel="noopener">네이버 지도 길찾기</a><a class="b-kakao" href="'+kmapTo(f.venue,f.lat,f.lng)+'" target="_blank" rel="noopener">카카오맵 길찾기</a><a class="b-park" href="'+nmap(f.venue+' 주차장')+'" target="_blank" rel="noopener">주변 주차장 더 보기</a>'+(f.officialUrl?'<a class="b-off" href="'+esc(f.officialUrl)+'" target="_blank" rel="noopener">공식 안내</a>':'')+'</div></article>';
}
function render(){
  const q=$('#q').value.trim(); const words=q.split(/\s+/).filter(Boolean);
  let list=FESTS.filter(f=>!cur||f.short===cur);
  if(words.length) list=list.filter(f=>{const hay=[f.name,f.region,f.short,f.venue,f.address,f.feature,(f.highlights||[]).join(' ')].join(' ');return words.every(w=>hay.includes(w));});
  chipBar();
  $('#count').textContent=(q?'"'+q+'" 검색 결과 ':'')+list.length+'개 축제';
  let html=list.map(card).join('');
  if(q && !list.length){ html='<div class="free"><h2>"'+esc(q)+'" 바로 길찾기</h2><p>목록에 없는 축제나 장소예요. 아래 버튼으로 지도에서 바로 길찾기와 주변 주차장을 찾아보세요.</p><div class="btns"><a class="b-naver" href="'+nmap(q)+'" target="_blank" rel="noopener">네이버 지도 길찾기</a><a class="b-kakao" href="https://map.kakao.com/link/search/'+enc(q)+'" target="_blank" rel="noopener">카카오맵에서 찾기</a><a class="b-park" href="'+nmap(q+' 주차장')+'" target="_blank" rel="noopener">주변 주차장 찾기</a></div></div>'; }
  $('#list').innerHTML=html;
  const u=new URL(location.href); if(q) u.searchParams.set('q',q); else u.searchParams.delete('q'); try{history.replaceState(null,'',u);}catch(e){}
}
$('#f').addEventListener('submit',e=>{e.preventDefault();cur='';render();window.scrollTo({top:$('#list').offsetTop-80,behavior:'smooth'});});
$('#q').addEventListener('input',()=>{cur='';render();});
const q0=new URLSearchParams(location.search).get('q'); if(q0) $('#q').value=q0;
render();
</script></body></html>
